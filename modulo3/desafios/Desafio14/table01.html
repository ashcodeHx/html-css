<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Tabela desafio 14</title>
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
            width: 500px;
        }

        th{
            border: 1px solid black;
            padding: 10px;
            background-color: #635f5f;
            color: white;
        }

        td{
            border: 1px solid black;
            padding: 3px;
            background-color: white;
            color: black;
        }

        tbody th{
            background-color: white;
            color: black;
        }

        td.numero{
            text-align: center;
        }
    
    </style>
</head>
<body>
    <table>
       <thead>
           <tr>
               <th rowspan="2" scope="col">Area</th>
               <th rowspan="2" scope="col">Disciplinas</th>
               <th colspan="2" scope="colgroup">Notas</th>
               <th rowspan="2" scope="col">Media</th>
           </tr>
           <tr>
               <th scope="col">Nota1</th>
               <th scope="col">Nota2</th>
           </tr>
       </thead>
       <tbody>
           <tr>
              <th rowspan="4" scope="rowgroup">Exatas</th>
              <td>Matemaica</td>
              <td class="numero">0.0</td> 
              <td class="numero">0.0</td>
              <td class="numero">0.0</td>
           </tr>
           <tr>  
              <td>Fisica</td>
              <td class="numero">0.0</td>
              <td class="numero">0.0</td>
              <td class="numero">0.0</td>
           </tr>
           <tr>    
              <td>Quimica</td>
              <td class="numero">0.0</td>
              <td class="numero">0.0</td>
              <td class="numero">0.0</td>
          </tr>
          <tr>
              <td>Biologia</td>
              <td class="numero">0.0</td>
              <td class="numero">0.0</td>
              <td class="numero">0.0</td>
         </tr>
         <tr>
            <td colspan="4" style="background-color: #635f5f;  color: white; font-weight: bold;">Medias de Exatas</td>
            <td style="background-color: #635f5f; color: white;" class="numero">0.0</td>
         </tr>
         <tr>
            <th rowspan="2">Humanas</th>
            <td>Historia</td>
            <td class="numero">0.0</td>
            <td class="numero">0.0</td>
            <td class="numero">0.0</td>
         </tr>
         <tr>
            <td>Geografia</td>
            <td class="numero">0.0</td>
            <td class="numero">0.0</td>
            <td class="numero">0.0</td>
        </tr>
        <tr>
            <td colspan="4" style="background-color: #635f5f; color: white; font-weight: bold;">Medias de Humanas</td>
            <td style="background-color: #635f5f; color: white;" class="numero">0.0</td>
        </tr>
       </tbody>
    </table>
</body>
</html>
